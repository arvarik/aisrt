[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "srtgen"
version = "0.1.0"
description = "Ultimate SRT Generator - Hardware-aware, concurrent pipeline for subtitle generation."
authors = ["Arvind <arvind@example.com>"]
readme = "README.md"
packages = [{include = "srtgen", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = "^0.9.0"}
rich = "^13.7.0"
loguru = "^0.7.2"
pydantic = "^2.5.3"
aiosqlite = "^0.19.0"
psutil = "^5.9.8"
pynvml = "^11.5.0"
faster-whisper = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
ruff = "^0.2.0"
mypy = "^1.8.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
