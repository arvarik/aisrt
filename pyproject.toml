[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "aisrt"
dynamic = ["version"]
description = "Hardware-aware, concurrent pipeline for broadcast-quality subtitle generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Arvind", email = "arvind.arik@gmail.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "subtitles",
    "srt",
    "whisper",
    "faster-whisper",
    "speech-to-text",
    "transcription",
    "ffmpeg",
    "nas",
    "cuda",
    "asyncio",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.14.2",
    "aiosqlite>=0.19.0",
    "psutil>=5.9.8",
    "nvidia-ml-py>=12.535",
    # BatchedInferencePipeline and the large-v3-turbo alias both arrived in 1.1.
    "faster-whisper>=1.2,<2",
    "numpy>=1.24",
    "huggingface-hub>=0.21",
]

[project.urls]
Homepage = "https://github.com/arvarik/aisrt"
Repository = "https://github.com/arvarik/aisrt"
Issues = "https://github.com/arvarik/aisrt/issues"
Changelog = "https://github.com/arvarik/aisrt/blob/main/CHANGELOG.md"
Documentation = "https://github.com/arvarik/aisrt/blob/main/docs/ARCHITECTURE.md"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.3,<0.17",
    "mypy>=1.15",
    "types-psutil>=6.0",
]

[project.scripts]
aisrt = "aisrt.cli:app"

# --- Version from Git tags ---
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/aisrt/_version.py"

# --- Build targets ---
[tool.hatch.build.targets.wheel]
packages = ["src/aisrt"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/aisrt/_version.py"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C4",    # flake8-comprehensions
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async, catches blocking calls inside async functions
    "RUF",   # ruff-specific rules
    "N",     # pep8-naming
    "LOG",   # flake8-logging
    "RET",   # flake8-return
    "D",     # pydocstyle, enforced because CONTRIBUTING requires docstrings
]
ignore = [
    "B008",      # typer.Option and friends belong in defaults
    "D203",      # incompatible with D211
    "D213",      # incompatible with D212
    # A library boundary should expose its deadline. Each of these functions
    # applies the value with asyncio.timeout internally.
    "ASYNC109",
]

# Subtitle text carries full-width CJK punctuation on purpose.
allowed-confusables = ["，", "；", "：", "！", "？", "、", "。", "’", "”", "»"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, spawn ffmpeg by name, and relax directory modes on purpose.
"tests/**" = ["S101", "S103", "S104", "S603", "S607", "PT012", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# No python_version pin: mypy checks against the interpreter it runs on, and CI
# runs the whole supported matrix.
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src/aisrt", "tests"]
exclude = ["src/aisrt/_version\\.py"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "pynvml.*", "ctranslate2.*", "huggingface_hub.*", "aiosqlite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=aisrt",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
xfail_strict = true
markers = [
    "integration: exercises the real ffmpeg and ffprobe binaries",
]

[tool.coverage.run]
source = ["src/aisrt"]
branch = true
omit = ["src/aisrt/_version.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
