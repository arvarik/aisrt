name: Feature request
description: Suggest a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that aisrt cannot do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: The change you want
      description: Describe the behavior you expect. Include the command line you would type.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
