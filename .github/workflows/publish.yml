name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v0.1.0, v1.0.0, etc.)

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Check that the built version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! ls "dist/aisrt-${TAG}"*.whl >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not match the built distribution:"
            ls dist/
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: pypi  # GitHub environment with PyPI OIDC trust
    permissions:
      id-token: write       # Required for OIDC token request
      contents: read
      attestations: write   # Required for SLSA provenance

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Generate SLSA provenance attestation
      - name: Generate attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      # Publish to PyPI using Trusted Publishing
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
