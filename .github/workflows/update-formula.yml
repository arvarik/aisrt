name: Update Homebrew Formula

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: update-formula-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI availability
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for aisrt $VERSION on PyPI..."
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/aisrt/$VERSION/json" > /dev/null 2>&1; then
              echo "Package available on PyPI"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "::error::Package not found on PyPI after 5 minutes"
          exit 1

      - name: Download sdist and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://files.pythonhosted.org/packages/source/a/aisrt/aisrt-${VERSION}.tar.gz"
          echo "Downloading $URL"
          curl -fSL "$URL" -o aisrt.tar.gz
          SHA256=$(sha256sum aisrt.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - name: Update Formula/aisrt.rb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          # Anchor both edits to the top-level stanza. An unanchored match would
          # rewrite every url and sha256 line, including any resource block.
          sed -i "0,/^  url \".*\"/s||  url \"https://files.pythonhosted.org/packages/source/a/aisrt/aisrt-${VERSION}.tar.gz\"|" Formula/aisrt.rb
          sed -i "0,/^  sha256 \".*\"/s||  sha256 \"${SHA256}\"|" Formula/aisrt.rb
          echo "Updated Formula/aisrt.rb:"
          cat Formula/aisrt.rb

      - name: Open a pull request with the updated formula
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update Homebrew formula to v${{ steps.version.outputs.version }}"
          title: "chore: update Homebrew formula to v${{ steps.version.outputs.version }}"
          body: |
            Automated formula update for the `v${{ steps.version.outputs.version }}` release.
          branch: chore/homebrew-v${{ steps.version.outputs.version }}
          base: main
          add-paths: Formula/aisrt.rb
          delete-branch: true
