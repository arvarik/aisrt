services:
  aisrt:
    image: ghcr.io/arvarik/aisrt:latest
    container_name: aisrt
    # CTranslate2 needs shared memory for its worker pool. The Docker default of
    # 64 MB is not enough and shows up as a core dump on a large file.
    shm_size: "4gb"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Bypass the anonymous Hugging Face rate limit when downloading a model.
      - HF_TOKEN=${HF_TOKEN:-}
      # Every setting has an AISRT_ variable. A command line option overrides it.
      # - AISRT_TRANSLATE=true
      # - AISRT_WATCH=true
      # - AISRT_WATCH_INTERVAL_MINS=60
      # - AISRT_FILTERS__MIN_AGE_MINS=30
      # - AISRT_HARDWARE__FORCE_MODEL=large-v3
      # - AISRT_HARDWARE__FORCE_DEVICE=cuda
      # - AISRT_HARDWARE__FORCE_COMPUTE_TYPE=float16

    volumes:
      # The media library. Mount it read-write so the tool can write subtitles.
      - /mnt/user/media/movies:/media:rw
      # The state database. Keep it on local storage: SQLite write-ahead logging
      # does not work over NFS or SMB, and aisrt warns when it detects that.
      - ./aisrt_data:/config

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Watch mode turns the container into a daemon that rescans on an interval.
    # Drop --watch to process the queue once and exit.
    command: ["run", "/media", "--watch", "--watch-interval", "60", "--min-age-mins", "60"]

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
